<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Playful Font</title>
	<link rel="stylesheet" type="text/css" href="pffont.css">
<link rel="stylesheet" href="https://use.typekit.net/lqa7gax.css">
</head>
<body>

			
<div class="bg-floaters">
    <div class="floater">A</div>
    <div class="floater">B</div>
    <div class="floater">Q</div>
    <div class="floater">E</div>
    <div class="floater">S</div>
    <div class="floater">X</div>
    <div class="floater">M</div>
    <div class="floater">R</div>
    <div class="floater">T</div>
    <div class="floater">Z</div> 
  </div>

<div class="containerskater"><div class="LetterE">E</div></div>


<div class="containerletter"><a id="home" class="btn" href="index.html">RETURN TO HOMEPAGE</a></div>

<!-- Music Player -->
<div class="music-player">
  <audio id="bg-music" src="sounds/Search and Destroy.mp3" loop></audio>
  <button id="play-pause">Play</button>
  <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5">
</div>

<script>
  const audio = document.getElementById('bg-music');
  const playPauseBtn = document.getElementById('play-pause');
  const volumeSlider = document.getElementById('volume');
  audio.volume = volumeSlider.value;

  playPauseBtn.addEventListener('click', () => {
    if (audio.paused) {
      audio.play();
      playPauseBtn.textContent = 'Pause';
    } else {
      audio.pause();
      playPauseBtn.textContent = 'Play';
    }
  });

  volumeSlider.addEventListener('input', () => {
    audio.volume = volumeSlider.value;
  });
</script>

</body>
</html>
